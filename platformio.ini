; ESP32 Spectrum Radar - ported to the ES3C28P board:
; ESP32-S3, 2.8" ILI9341V IPS LCD (SPI), FT6336G capacitive touch (I2C),
; 16MB flash, 8MB octal PSRAM.
;
; Original project (ESP32-2432S022C "CYD", ST7789 + CST816S, LVGL 9 via
; esp32_smartdisplay): https://github.com/earlchirchir/ESP32-Spectrum-Radar
; This port reuses the hardware layer already verified on this board by the
; sibling HelloWorld project (TFT_eSPI + FT6336 + LVGL 8.3, vendored in lib/).

[platformio]
default_envs = es3c28p

[env:es3c28p]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; ---- N16R8 memory layout (16MB QSPI flash + 8MB Octal PSRAM) ----
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

build_unflags = -std=gnu++11

build_flags =
    -std=gnu++17
    -O2

    ; PlatformIO does not put include/ on the search path for vendored
    ; libraries' own sources; lib/lvgl needs it to find include/lv_conf.h.
    -Iinclude
    ; Force the plain #include "lv_conf.h" path (auto-detection is unreliable
    ; for this toolchain's C compiles; without it LVGL's tick silently freezes).
    -DLV_CONF_INCLUDE_SIMPLE=1

    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1

    ; ---- TFT_eSPI configuration for this board (ILI9341V, 4-wire SPI) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    ; Default SPI_PORT (FSPI = index 0) crashes on ESP32-S3 (StoreProhibited in
    ; begin_tft_write). See https://github.com/Bodmer/TFT_eSPI/issues/3743
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=46
    -DTFT_RST=-1
    -DTFT_BL=45
    -DTFT_BACKLIGHT_ON=HIGH
    ; The IPS ILI9341V panel shows inverted colors without this (white
    ; background, red instead of cyan) - confirmed on hardware.
    -DTFT_INVERSION_ON=1
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
